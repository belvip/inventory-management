# Test configuration
spring.config.import=optional:file:.env[.properties]

# Database H2 for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT Test config
spring.app.jwtSecret=testSecretKeyForJWTTokenGenerationThatIsLongEnoughForHS256AlgorithmAndSecureEnoughForProductionUse123456789
spring.app.jwtExpirationMs=900000
spring.app.jwtRefreshExpirationMs=86400000

# OAuth2 Test config (dummy values)
spring.security.oauth2.client.registration.github.client-id=test-github-client-id
spring.security.oauth2.client.registration.github.client-secret=test-github-client-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email

spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Frontend URL
frontend.url=http://localhost:3000

# MinIO Test config
minio.url=http://localhost:9000
minio.access-key=test
minio.secret-key=test123
minio.bucket-name=test-bucket

# Email Test config
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=testpassword

# Default password
DEFAULT_USER_PASSWORD=password

# API prefix
api.prefix=api/v1