spring.config.import=optional:file:.env[.properties]

spring.application.name=inventory-management
server.port=${APP_PORT}

# --------------------------
# Swagger UI
# --------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.show-actuator=false

# --------------------------
# Database Configuration (PostgreSQL Neon)
# --------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&channel_binding=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# --------------------------
# Security (JWT)
# --------------------------
spring.app.jwtSecret=${JWT_SECRET_KEY}
spring.app.jwtExpirationMs=900000
spring.app.jwtRefreshExpirationMs=86400000

# --------------------------
# MinIO
# --------------------------
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET_NAME}

# --------------------------
# FRONTEND URL
# --------------------------
frontend.url=${FRONTEND_URL}


# --------------------------
# EMAIL SETTINGS
# --------------------------
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --------------------------
# GITHUB OAuth2 CONFIGURATION SETTINGS
# --------------------------
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=${GITHUB_CLIENT_SCOPE}


# --------------------------
# API
# --------------------------
api.prefix=api/v1

#spring.security.user.name=admin
#spring.security.user.password=password

# --------------------------
# Multipart File Upload
# --------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


