version: '3.8'

services:
  inventory:
    image: belvinar/new-inventory
    build: .
    env_file: .env
    environment:
      - PORT=${APP_PORT}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    ports:
      - "8282:${APP_PORT:-8282}"
    depends_on:
      - minio
    networks:
      - default

  minio:
    image: minio/minio
    env_file: .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  minio_data:
